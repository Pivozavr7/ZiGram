name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Fetch TDLib
        run: bash scripts/fetch-tdlib.sh

      - name: Run tests
        run: zig build test --summary all

  build:
    name: Build (core + cli + gui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Fetch dependencies
        run: bash scripts/fetch-deps.sh

      - name: Install SDL build dependencies
        # SDL refuses to configure without a windowing backend (X11 or
        # Wayland); the runner image ships without their development files.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxext-dev libxcursor-dev libxrandr-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libegl1-mesa-dev libasound2-dev libdbus-1-dev libudev-dev

      - name: Build SDL3
        run: bash scripts/build-sdl.sh

      - name: Build
        run: zig build

      - name: Run tests
        run: zig build test --summary all

      - name: Smoke test CLI
        run: |
          bash scripts/fetch-tdlib.sh
          ./zig-out/bin/zigram-cli version
